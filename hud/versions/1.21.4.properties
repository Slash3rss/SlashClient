minecraft_version=1.21.4
fabric_api_version=0.119.4+1.21.4
java=21
obfuscated=true
targets=1.21.4
range=~1.21.4
# names that changed in 26.1 (whole words, applied to the shared code before compiling)
rename.GuiGraphicsExtractor=GuiGraphics
rename.extractRenderState=render
rename.extractBackground=renderBackground
rename.extractPanorama=renderPanorama
rename.extractContent=renderContent
rename.extractContents=renderWidget
rename.KeyMappingHelper=KeyBindingHelper
rename.registerKeyMapping=registerKeyBinding
rename.afterExtract=afterRender
rename.beforeExtract=beforeRender
rename.extractPlayerHealth=renderPlayerHealth
rename.extractHearts=renderHearts
rename.MOB_EFFECTS=STATUS_EFFECTS
rename.resizeGui=resizeDisplay
rename.getOverworldClockTime=getDayTime
rename.getWidgets=getButtons
replace.fabric.api.client.keymapping.v1=fabric.api.client.keybinding.v1
# drawing calls on the GuiGraphics `g`
replace.g.text(=g.drawString(
replace.g.centeredText(=g.drawCenteredString(
replace.g.item(=g.renderItem(
replace.g.skin(=dev.slash3rss.slashclient.hud.Compat.skin(g,
replace.net.minecraft.client.multiplayer.chat.GuiMessage=net.minecraft.client.GuiMessage
rename.extractPingIcon=renderPingIcon
rename.addClientSystemMessage=addMessage
rename.LivingEntityRenderLayerRegistrationCallback=LivingEntityFeatureRendererRegistrationCallback
# 1.21.11 renamed ResourceLocation to Identifier
rename.Identifier=ResourceLocation
# before 1.21.11 the models sat in one package, Util was not in util, and a few calls had other names
replace.net.minecraft.client.model.player.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.allay.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.parrot.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.bee.=net.minecraft.client.model.
replace.net.minecraft.client.model.ambient.=net.minecraft.client.model.
replace.net.minecraft.client.model.monster.vex.=net.minecraft.client.model.
replace.net.minecraft.client.model.monster.phantom.=net.minecraft.client.model.
replace.net.minecraft.client.model.monster.blaze.=net.minecraft.client.model.
replace.net.minecraft.client.model.object.equipment.=net.minecraft.client.model.
replace.net.minecraft.client.renderer.rendertype.=net.minecraft.client.renderer.
replace.net.minecraft.util.Util;=net.minecraft.Util;
replace.camera.yRot()=camera.getYRot()
replace.camera.xRot()=camera.getXRot()
replace..withoutShadow()=.withShadowColor(0)
rename.RenderTypes=RenderType
# ---------- before 1.21.9 / 1.21.6: the GUI drew through a PoseStack and RenderTypes, input came as plain numbers ----------
rename.setScreenAndShow=setScreen
rename.AvatarRenderState=PlayerRenderState
rename.AvatarRenderer=PlayerRenderer
replace.PlayerRenderer<?>=PlayerRenderer
rename.SubmitNodeCollector=MultiBufferSource
# GUI pictures: RenderType::guiTextured where later versions take RenderPipelines.GUI_TEXTURED
rename.RenderPipelines=RenderType
replace.RenderType.GUI_TEXTURED=RenderType::guiTextured
# the 2D pose calls go through a small wrapper of the PoseStack (compat/GuiPose)
replace.g.pose()=dev.slash3rss.slashclient.hud.compat.GuiPose.of(g)
# fonts were picked by their id alone (Compat.font)
rename.FontDescription=ResourceLocation
replace.net.minecraft.network.chat.ResourceLocation=net.minecraft.resources.ResourceLocation
# stand-ins for the mouse and key events (compat/); super calls get the plain numbers
replace.net.minecraft.client.input.MouseButtonEvent=dev.slash3rss.slashclient.hud.compat.MouseButtonEvent
replace.net.minecraft.client.input.KeyEvent=dev.slash3rss.slashclient.hud.compat.KeyEvent
replace.super.mouseClicked(e,=super.mouseClicked(e.x(), e.y(), e.button()) || dev.slash3rss.slashclient.hud.Compat.ignore(
replace.super.mouseDragged(e,=super.mouseDragged(e.x(), e.y(), e.button(),
replace.super.mouseReleased(e)=super.mouseReleased(e.x(), e.y(), e.button())
replace.super.keyPressed(e)=super.keyPressed(e.key(), e.scancode(), e.modifiers())
replace.super.keyReleased(e)=super.keyReleased(e.key(), e.scancode(), e.modifiers())
replace.key.matches(e)=key.matches(e.key(), e.scancode())
replace.super.onClick(e,=super.onClick(e.x(), e.y()); dev.slash3rss.slashclient.hud.Compat.ignore(
# Fabric's HUD elements on the older HUD layers (compat/)
replace.net.fabricmc.fabric.api.client.rendering.v1.hud.=dev.slash3rss.slashclient.hud.compat.
# skins: one ResourceLocation per picture, the record in another package
replace.net.minecraft.world.entity.player.PlayerSkin=net.minecraft.client.resources.PlayerSkin
rename.PlayerModelType=PlayerSkin.Model
replace.ClientAsset.Texture=ResourceLocation
replace.net.minecraft.core.ClientAsset;=net.minecraft.resources.ResourceLocation;
replace.net.minecraft.client.model.Model<?>=net.minecraft.client.model.Model
replace.skin.body()=skin.texture()
replace.skin.cape()=skin.capeTexture()
replace.skin.elytra()=skin.elytraTexture()
replace.s.body().texturePath()=s.texture()
replace.getSkin().cape()=getSkin().capeTexture()
replace.cape.texturePath()=cape
# no outline colour for glowing players on our layers (Compat.submitModel)
replace.state.outlineColor=0
# key categories were plain translation keys
replace.KeyMapping.Category=String
# smaller renames
replace.getGameProfile().id()=getGameProfile().getId()
replace.getProfile().id()=getProfile().getId()
replace.getCurrentVersion().name()=getCurrentVersion().getName()
replace.camera.position()=camera.getPosition()
replace.minecraft.disconnectFromWorld(=dev.slash3rss.slashclient.hud.Compat.disconnectFromWorld(minecraft,
replace.mc.disconnectFromWorld(=dev.slash3rss.slashclient.hud.Compat.disconnectFromWorld(mc,
replace.ClientLevel.DEFAULT_QUIT_MESSAGE=net.minecraft.network.chat.Component.empty()
# ---------- before 1.21.5 ----------
replace.inv.getSelectedSlot()=inv.selected
replace.inv.setSelectedSlot(=Compat.setSelectedSlot(inv,
replace.MobEffects.SPEED=MobEffects.MOVEMENT_SPEED
replace.CommonComponents.disconnectButtonLabel(=dev.slash3rss.slashclient.hud.Compat.disconnectButtonLabel(
