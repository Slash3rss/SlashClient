minecraft_version=1.20.1
fabric_api_version=0.92.12+1.20.1
java=17
obfuscated=true
targets=1.20.1
range=~1.20.1
# names that changed in 26.1 (whole words, applied to the shared code before compiling)
rename.GuiGraphicsExtractor=GuiGraphics
rename.extractRenderState=render
rename.extractBackground=renderBackground
rename.extractContent=renderContent
rename.extractContents=renderWidget
rename.KeyMappingHelper=KeyBindingHelper
rename.registerKeyMapping=registerKeyBinding
rename.afterExtract=afterRender
rename.beforeExtract=beforeRender
rename.extractPlayerHealth=renderPlayerHealth
rename.extractHearts=renderHearts
rename.MOB_EFFECTS=STATUS_EFFECTS
rename.resizeGui=resizeDisplay
rename.getOverworldClockTime=getDayTime
rename.getWidgets=getButtons
replace.fabric.api.client.keymapping.v1=fabric.api.client.keybinding.v1
# drawing calls on the GuiGraphics `g`
replace.g.text(=g.drawString(
replace.g.centeredText(=g.drawCenteredString(
replace.g.item(=g.renderItem(
replace.g.skin(=g.submitSkinRenderState(
replace.net.minecraft.client.multiplayer.chat.GuiMessage=net.minecraft.client.GuiMessage
rename.extractPingIcon=renderPingIcon
rename.addClientSystemMessage=addMessage
rename.LivingEntityRenderLayerRegistrationCallback=LivingEntityFeatureRendererRegistrationCallback
# 1.21.11 renamed ResourceLocation to Identifier
rename.Identifier=ResourceLocation
# before 1.21.11 the models sat in one package, Util was not in util, and a few calls had other names
replace.net.minecraft.client.model.player.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.allay.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.parrot.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.bee.=net.minecraft.client.model.
replace.net.minecraft.client.model.ambient.=net.minecraft.client.model.
replace.net.minecraft.client.model.monster.vex.=net.minecraft.client.model.
replace.net.minecraft.client.model.monster.phantom.=net.minecraft.client.model.
replace.net.minecraft.client.model.monster.blaze.=net.minecraft.client.model.
replace.net.minecraft.client.model.object.equipment.=net.minecraft.client.model.
replace.net.minecraft.client.renderer.rendertype.=net.minecraft.client.renderer.
replace.net.minecraft.util.Util;=net.minecraft.Util;
replace.camera.yRot()=camera.getYRot()
replace.camera.xRot()=camera.getXRot()
# text shadows have no colour before 1.21.4: drawn without one where asked
replace..withoutShadow()=
rename.RenderTypes=RenderType
# ---------- before 1.21.2 ----------
# the GUI's pose is a PoseStack: compat.Pose2D gives it the 2D calls of later versions
replace.g.pose()=dev.slash3rss.slashclient.hud.compat.Pose2D.of(g)
# no render pipelines: textures go through compat.Legacy (colour from the shader)
replace.net.minecraft.client.renderer.RenderPipelines=dev.slash3rss.slashclient.hud.compat.RenderPipelines
replace.g.blit(=dev.slash3rss.slashclient.hud.compat.Legacy.blit(g,
replace.g.blitSprite(=dev.slash3rss.slashclient.hud.compat.Legacy.blitSprite(g,
# no input event records, no HUD element registry in Fabric: stand-ins in compat
replace.net.minecraft.client.input.=dev.slash3rss.slashclient.hud.OldInput.
replace.net.fabricmc.fabric.api.client.rendering.v1.hud.=dev.slash3rss.slashclient.hud.compat.
# key mapping categories are plain strings
replace.KeyMapping.Category=String
rename.setScreenAndShow=setScreen
rename.ToastManager=ToastComponent
replace.mc.getToastManager()=mc.getToasts()
replace..getSelectedSlot()=.selected
replace.inv.setSelectedSlot(=dev.slash3rss.slashclient.hud.compat.Legacy.setSelectedSlot(inv,
replace.getProfile().id()=getProfile().getId()
replace.getGameProfile().id()=getGameProfile().getId()
replace.getCurrentVersion().name()=getCurrentVersion().getName()
replace.MobEffects.SPEED=MobEffects.MOVEMENT_SPEED
replace.packet.gameTime()=packet.getGameTime()
replace.camera.position()=camera.getPosition()
replace.key.matches(e)=key.matches(e.key(), e.scancode())
replace.DynamicTexture(()=dev.slash3rss.slashclient.hud.compat.LegacyTexture(()
replace.image.getPixel(=dev.slash3rss.slashclient.hud.compat.Legacy.getPixel(image,
replace.image.setPixel(=dev.slash3rss.slashclient.hud.compat.Legacy.setPixel(image,
replace.view.setPixel(=dev.slash3rss.slashclient.hud.compat.Legacy.setPixel(view,
replace.Screenshot.takeScreenshot(=dev.slash3rss.slashclient.hud.compat.Legacy.takeScreenshot(
replace.CommonComponents.disconnectButtonLabel(=dev.slash3rss.slashclient.hud.compat.Legacy.disconnectButtonLabel(
replace.minecraft.disconnectFromWorld(ClientLevel.DEFAULT_QUIT_MESSAGE)=dev.slash3rss.slashclient.hud.compat.Legacy.disconnectFromWorld(minecraft)
replace.mc.disconnectFromWorld(=dev.slash3rss.slashclient.hud.compat.Legacy.disconnectFromWorld(mc,
replace.mc.services().sessionService()=mc.getMinecraftSessionService()
# the client gametest API came later (1.21.4)
gametest=false
rename.FontDescription=ResourceLocation
replace.net.minecraft.network.chat.ResourceLocation=net.minecraft.resources.ResourceLocation
replace.net.minecraft.client.model.animal.axolotl.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.fox.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.feline.=net.minecraft.client.model.
replace.net.minecraft.client.model.animal.frog.=net.minecraft.client.model.
# ---------- before 1.20.2 (on top of the 1.21.1 names above) ----------
# no Identifier.fromNamespaceAndPath / withDefaultNamespace yet
rename.fromNamespaceAndPath=tryBuild
rename.withDefaultNamespace=tryParse
# Minecraft has no getGameProfile(): the user's profile
replace.mc.getGameProfile()=mc.getUser().getGameProfile()
replace.minecraft.getGameProfile()=minecraft.getUser().getGameProfile()
replace.getInstance().getGameProfile()=getInstance().getUser().getGameProfile()
replace.ServerData.Type.OTHER)=ServerData.class.isArray())
rename.isSameItemSameComponents=isSameItemSameTags
replace.Minecraft.getInstance().getWindow().getGuiScale()=(int) Minecraft.getInstance().getWindow().getGuiScale()
rename.SystemToastId=SystemToastIds
replace.pause.showsPauseMenu()=dev.slash3rss.slashclient.hud.Compat.showsPauseMenu(pause)
replace.mc.getDebugOverlay().showDebugScreen()=mc.options.renderDebug
# status effects are no holders yet
replace.net.minecraft.core.Holder<net.minecraft.world.effect.MobEffect>=net.minecraft.world.effect.MobEffect
replace.Holder<MobEffect>=MobEffect
replace.hasEffect(Lnet/minecraft/core/Holder;)Z=hasEffect(Lnet/minecraft/world/effect/MobEffect;)Z
replace..getRegisteredName()=.unwrapKey().map(k -> k.location().toString()).orElse("minecraft:plains")
replace.net.minecraft.client.gui.screens.options.controls.KeyBindsScreen=net.minecraft.client.gui.screens.controls.KeyBindsScreen
replace.net.minecraft.client.gui.screens.options.LanguageSelectScreen=net.minecraft.client.gui.screens.LanguageSelectScreen
replace.RenderTarget;ILjava/util/function/Consumer;)V=RenderTarget;Ljava/util/function/Consumer;)V
replace.extractPanorama(=dev.slash3rss.slashclient.hud.compat.Legacy.panorama(
# Java 17: no virtual threads, no List.getFirst/getLast
replace.Thread.ofVirtual().start(=dev.slash3rss.slashclient.hud.compat.Legacy.thread(
replace.list.getLast()=list.get(list.size() - 1)
replace.clip.getLast()=clip.get(clip.size() - 1)
replace.clip.getFirst()=clip.get(0)
