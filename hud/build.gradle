plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "slashclient-hud-${project.minecraft_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// `gradlew runClientGameTest` starts the real game, makes a world and saves screenshots
// of the HUD and the editor to build/run/clientGameTest/screenshots
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "slashclient-hud-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
