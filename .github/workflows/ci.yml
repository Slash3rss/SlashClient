name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, testy, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # tests don't start Electron, so skip downloading its binary
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: SlashClient HUD (mod Fabric)
        working-directory: hud
        shell: bash
        run: ./gradlew build --no-daemon
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Serwer znajomych
        working-directory: server
        run: npm ci && npm run typecheck && npm test
