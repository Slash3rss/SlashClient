name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, testy, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Linux on our own runner (LXC on Proxmox), but only for pushes to main: pull requests from
    # anyone stay on GitHub's machines, so no stranger's code runs on our server
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' && fromJSON('["self-hosted", "linux", "proxmox"]') || matrix.os }}
    env:
      # tests don't start Electron, so skip downloading its binary
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Mod SlashClient (Fabric, every game version)
        working-directory: hud
        shell: bash
        run: ./build-all.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Serwer znajomych
        working-directory: server
        run: npm ci && npm run typecheck && npm test
