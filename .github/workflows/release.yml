name: Release

# Push a tag like v0.2.0 to build installers and publish them as a GitHub Release.
# Installed launchers pick the new version up through electron-updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # One release first, so the three installer jobs below all upload to it
  # (left to themselves they raced and each made its own release with the same tag).
  release:
    name: Wydanie na GitHubie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          # the description comes from release-notes/<tag>.md when there is one
          notes="release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --title "SlashClient ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" --title "SlashClient ${TAG#v}" --generate-notes
          fi

  installers:
    name: Instalator (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: SlashClient HUD (mod Fabric, every game version)
        working-directory: hud
        shell: bash
        run: ./build-all.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build and publish
        shell: bash
        run: |
          # macOS signing is optional: only pass the signing variables when the secrets exist
          # (an empty CSC_LINK makes electron-builder look for a certificate file and fail)
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
