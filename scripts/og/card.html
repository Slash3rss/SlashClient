<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Outfit; src: url(../../server/web/vendor/fonts/outfit-latin.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Outfit; src: url(../../server/web/vendor/fonts/outfit-latin-ext.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07090f; font-family: Outfit, sans-serif; color: #f1f5f9; }
  .shot { position: absolute; inset: 0 0 0 360px; background: url(../../server/web/img/hud-game.jpg) center / cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #07090f 30%, rgba(7, 9, 15, .86) 52%, rgba(7, 9, 15, .25) 100%); }
  .glow { position: absolute; left: -160px; top: -200px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(closest-side, rgba(59, 130, 246, .28), transparent); }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; }
  .brand b { color: #60a5fa; }
  h1 { font-size: 66px; line-height: 1.02; font-weight: 800; letter-spacing: -2px; }
  h1 span { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; color: transparent; }
  p { font-size: 27px; line-height: 1.35; color: #cbd5e1; max-width: 560px; }
  .chips { display: flex; gap: 12px; }
  .chip { padding: 9px 18px; border-radius: 999px; font-size: 21px; font-weight: 600; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); color: #e2e8f0; }
  .chip.free { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-color: transparent; color: #fff; }
</style>
</head>
<body>
  <div class="shot"></div>
  <div class="shade"></div>
  <div class="glow"></div>
  <div class="text">
    <div class="brand"><img src="../../server/web/vendor/logo.png" alt=""><span>Slash<b>Client</b></span></div>
    <h1>Minecraft,<br><span>tylko lepiej.</span></h1>
    <p>Launcher z własnym HUD-em, znajomymi, kosmetykami, benchmarkiem FPS i klipami.</p>
    <div class="chips"><span class="chip free">Za darmo</span><span class="chip">Windows</span><span class="chip">macOS</span><span class="chip">Linux</span></div>
  </div>
</body>
</html>
